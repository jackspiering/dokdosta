name: release

# Runs only when a v* tag is pushed (docs/releasing.md). It is the one workflow that can publish: it pushes the image to GHCR,
# creates the GitHub release, and signs both with the run's OIDC identity. Pull requests and main never get here; they run
# ci.yml, which builds the same artifacts as a snapshot and pushes nothing.
on:
  push:
    tags: ["v*"]

# No permissions by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: tests and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is a release tag, on main, with release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag like v0.1.0 or v0.2.0-rc.1"; exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG does not point at a commit on main: release from main, after the pull request is merged"; exit 1
          fi
          scripts/release/release-notes.sh "$TAG" >/dev/null
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Nothing from another run's cache: main's CI saves one under the same key, and go build trusts the compiled
          # packages in GOCACHE (scripts/ci/check-workflows.sh).
          cache: false
      - name: vet and unit tests
        env:
          CGO_ENABLED: "1" # -race needs cgo; the shipped binary is built with CGO_ENABLED=0
        run: go vet ./... && go test -race -count=1 ./...
      - name: release script self-tests
        run: |
          scripts/release/release-notes.sh --self-test
          scripts/release/verify.sh --self-test
          scripts/ci/check-dockerfiles.sh
          scripts/ci/check-workflows.sh --self-test && scripts/ci/check-workflows.sh

  publish:
    name: publish (image, binaries, signatures, provenance)
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The only job with these permissions. contents: write creates the release and its assets, packages: write pushes the image,
    # id-token: write is the OIDC identity of the keyless signatures, attestations: write stores the build provenance.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Nothing from another run's cache: main's CI saves one under the same key, and go build trusts the compiled
          # packages in GOCACHE (scripts/ci/check-workflows.sh).
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false # if buildx has to be downloaded, not from the Actions cache
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Go cache starts empty: fetch the modules before anything is published, so a proxy error fails here, retried.
      - name: Download the Go modules
        run: |
          for attempt in 1 2 3; do
            go mod download && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "::warning::go mod download failed (attempt $attempt of 3), trying again"
            sleep 15
          done
          go mod verify
      - name: Release notes from CHANGELOG.md
        run: scripts/release/release-notes.sh "$TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The tag this run is for. Otherwise GoReleaser takes the first tag on the commit, and an -rc tag on the same commit
          # sorts first: the final release would be published as the -rc (scripts/ci/check-workflows.sh).
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - name: Build provenance of the archives and SBOMs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
          create-storage-record: false
      - name: Build provenance of the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/digests.txt
          create-storage-record: false
      # The same script a user runs (docs/verifying-releases.md), against what was just published: if signing or attestation
      # did not work, this job fails (the release is already public; the failure is the alarm).
      - name: Verify what was published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release/verify.sh "$TAG" --dir "$RUNNER_TEMP/verify"
