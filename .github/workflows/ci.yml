name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's new push cancels its older run. Every push to main has its own group, so a merge never cancels the run of
# the merge before it: each commit on main gets a finished run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  scope:
    # What this run has to test. A pull request that changes only documentation (scripts/ci/changes.sh: *.md anywhere, and
    # docs/) skips every job except `go`, whose tests check the documentation; the required checks report "skipped", which
    # counts as passed (the integration and image-drift legs pass explicitly). Pushes to main always run everything. And
    # when the latest compose release is one the matrix pins, the "compose latest" shards stop early
    # (scripts/ci/compose-latest.sh). Plan section 6, *CI matrix*.
    name: scope (documentation only? is compose latest pinned?)
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      compose_latest: ${{ steps.compose.outputs.version }}
      latest_pinned: ${{ steps.compose.outputs.pinned }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Documentation only? (pull requests only; any doubt means code)
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          kind=code
          if [ "$EVENT" = pull_request ]; then
            # The checkout is the merge commit, whose first parent is the base branch: this is the pull request's change.
            # --no-renames lists both sides of a rename: moving a script to docs/x.md must count as removing the script.
            if files=$(git diff --no-renames --name-only HEAD^1 HEAD); then
              echo "$files"
              kind=$(printf '%s\n' "$files" | scripts/ci/changes.sh) || kind=code
            else
              echo "::warning::could not list the changed files; everything runs"
            fi
          fi
          echo "change: $kind"
          if [ "$kind" = docs ]; then
            echo "::notice::Documentation only: the jobs it cannot affect are skipped (build, vet and unit tests run)."
            echo "code=false" >>"$GITHUB_OUTPUT"
          else
            echo "code=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Is compose latest a release the matrix pins?
        id: compose
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # pipefail: without it a failure of the script is hidden by tee (it fails only on a broken compose matrix; a lookup
        # that fails prints pinned=false and exits 0).
        run: |
          set -o pipefail
          scripts/ci/compose-latest.sh .github/workflows/ci.yml | tee -a "$GITHUB_OUTPUT"

  go:
    name: build, vet, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: vet
        run: go vet ./... && go vet -tags integration ./...
      - name: build (static binary)
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o whalenurse ./cmd/whalenurse
          file whalenurse
          ! ldd whalenurse
      - name: The integration shards are every integration test, once (and the workflow's matrix is those shards)
        run: scripts/ci/shard-integration.sh --check-ci .github/workflows/ci.yml
      # Known vulnerabilities in the Go release and the modules that the code reaches (pinned; check-workflows.sh). It
      # fails on a new advisory without any code change: bump Go (go.mod and both Dockerfiles) or the module it names.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: unit tests (no Docker is touched)
        env:
          CGO_ENABLED: "1" # -race needs cgo; the shipped binary is built with CGO_ENABLED=0 above
        run: go test -race -count=1 ./...

  scripts:
    name: shellcheck and M0 self-tests
    runs-on: ubuntu-latest
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck -x scripts/ and test/
        run: |
          files=$( { grep -rIl --exclude-dir=testdata -E '^#!.*(ba)?sh' scripts test; find scripts test -name '*.sh'; } | sort -u)
          echo "$files"
          # Word splitting is wanted here: one path per line, none with spaces.
          # shellcheck disable=SC2086
          shellcheck -x $files
      - name: M0 self-tests (stubbed docker; none of them needs a daemon)
        run: |
          scripts/m0/selftest.sh
          scripts/scrub-fixture --self-test
          test/m0/run.sh selftest
          test/m0/m0b/selftest.sh
      - name: Release script self-tests (release notes from CHANGELOG.md, verify-release with stubbed cosign, gh and curl)
        run: |
          scripts/release/release-notes.sh --self-test
          scripts/release/verify.sh --self-test
      - name: Integration sharding self-test (the packing, the anchoring, the matrix check)
        run: scripts/ci/shard-integration.sh --self-test
      - name: CI scope self-tests (documentation only, compose latest pinned)
        run: |
          scripts/ci/changes.sh --self-test
          scripts/ci/compose-latest.sh --self-test
      - name: Dockerfile and Dockerfile.release ship the same compose and the same base images
        run: scripts/ci/check-dockerfiles.sh --self-test && scripts/ci/check-dockerfiles.sh

  workflows:
    name: workflows (actionlint, actions pinned to SHAs)
    runs-on: ubuntu-latest
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The offline check (also in make scripts-test), then each SHA against the tag its comment names (needs the network).
      - name: Every action is pinned to the commit of its release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/check-pins.sh --self-test
          scripts/ci/check-pins.sh --verify-remote
      - name: What the workflows' steps must say (scripts/ci/check-workflows.sh)
        run: scripts/ci/check-workflows.sh --self-test && scripts/ci/check-workflows.sh
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  release-snapshot:
    # What the release does, without the parts that publish: GoReleaser builds the archives, checksums, SBOMs and the image
    # from this commit. No registry login, no cosign, no id-token, no packages: write; nothing is pushed or signed.
    name: GoReleaser snapshot (builds everything, publishes nothing)
    runs-on: ubuntu-latest
    needs: [go, scope]
    if: needs.scope.outputs.code == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The BuildKit that builds the image, pinned (the default is the floating buildx-stable-1). Dependabot does not
          # update it: docs/releasing.md says how. scripts/ci/check-workflows.sh checks both workflows run the same one.
          driver-opts: |
            image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: check
      - name: goreleaser release --snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean --skip=sign
      - name: What the snapshot built
        run: |
          ls -l dist
          cat dist/checksums.txt
          # The SBOMs and archives are all in the checksums the release signs.
          [ "$(grep -c 'tar.gz$' dist/checksums.txt)" -eq 2 ]
          [ "$(grep -c 'sbom.spdx.json$' dist/checksums.txt)" -eq 2 ]
          amd64=$(find dist -type f -name whalenurse -path '*amd64*')
          file "$amd64" | grep -q "statically linked"
          "$amd64" version
          "$amd64" version | grep -q SNAPSHOT
      - name: The release image (amd64) runs, carries its labels, and is not root
        run: |
          docker image ls ghcr.io/jackspiering/whalenurse
          img=$(docker image ls ghcr.io/jackspiering/whalenurse --format '{{.Repository}}:{{.Tag}}' | grep -- '-amd64$' | head -n 1)
          echo "image: $img"
          docker run --rm "$img" version
          docker run --rm "$img" version | grep -q SNAPSHOT
          docker inspect -f '{{.Config.User}} {{index .Config.Labels "org.opencontainers.image.source"}} {{.Config.Healthcheck.Test}}' "$img" | tee /dev/stderr | grep -q '^65532:65532 https://github.com/jackspiering/whalenurse \[CMD /whalenurse healthcheck\]'
          # the bundled compose is there and is the version both Dockerfiles pin
          docker run --rm --entrypoint /usr/libexec/whalenurse/docker-compose "$img" version | tee /dev/stderr | grep -q "$(sed -n 's/^ARG COMPOSE_VERSION=//p' Dockerfile.release | head -n 1)"
      - name: The arm64 image builds too (no emulation needed; the final stage only copies)
        run: |
          mkdir -p "$RUNNER_TEMP/ctx/linux/arm64"
          cp "$(find dist -type f -name whalenurse -path '*arm64*' | head -n 1)" "$RUNNER_TEMP/ctx/linux/arm64/whalenurse"
          cp Dockerfile.release "$RUNNER_TEMP/ctx/Dockerfile"
          docker buildx build --platform linux/arm64 --output type=cacheonly "$RUNNER_TEMP/ctx"

  examples:
    name: examples (compose config, systemd-analyze verify)
    runs-on: ubuntu-latest
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: compose config -q on every example (and the variables they ask for are asked for)
        run: |
          docker compose version
          for d in minimal demo; do
            echo "== examples/$d"
            (cd "examples/$d" && DOCKER_GID=999 DEMO_DIR="$PWD" docker compose config -q)
            # without the variables the file must refuse to start, with a message that says what to do
            (cd "examples/$d" && ! docker compose config -q 2>"$RUNNER_TEMP/err.txt"); grep -q "required variable" "$RUNNER_TEMP/err.txt"
          done
          echo "== examples/full (with .env.example)"
          (cd examples/full && docker compose --env-file .env.example config -q)
          (cd examples/full && ! docker compose config -q 2>"$RUNNER_TEMP/err.txt"); grep -q 'required variable' "$RUNNER_TEMP/err.txt"
          jq -e . examples/full/tailscale/serve.json >/dev/null
      - name: systemd-analyze verify (the unit, pointed at a real binary; any output at all is a failure)
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/whalenurse" ./cmd/whalenurse
          sed "s|/usr/local/bin/whalenurse|$RUNNER_TEMP/whalenurse|" examples/systemd/whalenurse.service > "$RUNNER_TEMP/whalenurse.service"
          out=$(systemd-analyze verify "$RUNNER_TEMP/whalenurse.service" 2>&1) || { echo "$out"; exit 1; }
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
          systemd-analyze --offline=true security "$RUNNER_TEMP/whalenurse.service" | tail -n 3 || true

  image:
    # The image under test, built once: the integration shards and the demo load it. Each of them used to build it, 19 builds
    # a run, and the build is where the network flakes (two red runs on 20 Oct 2026 were proxy.golang.org stream errors in
    # `go mod download`). It is tried three times; BuildKit keeps the layers that succeeded.
    name: image (built once for the integration tests and the demo)
    runs-on: ubuntu-latest
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: |
          for attempt in 1 2 3; do
            docker build -t whalenurse-test/whalenurse:ci --build-arg VERSION=ci . && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "::warning::docker build failed (attempt $attempt of 3), trying again"
            sleep 15
          done
          docker save whalenurse-test/whalenurse:ci | gzip -1 >"$RUNNER_TEMP/whalenurse-image.tar.gz"
          ls -l "$RUNNER_TEMP/whalenurse-image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whalenurse-image
          path: ${{ runner.temp }}/whalenurse-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  demo:
    # The README's "Try it in 2 minutes", end to end, with the image built from this commit. Project whalenurse-test-demo only.
    name: demo (examples/demo, break bop and watch the ladder)
    runs-on: ubuntu-latest
    needs: [scope, image]
    if: needs.scope.outputs.code == 'true'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: whalenurse-image
          path: ${{ runner.temp }}/image
      - name: Install the latest Docker Engine 29.x and Compose 5.6.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci/setup-docker.sh classic
      - name: Load the image (built by the image job)
        run: docker load -i "$RUNNER_TEMP/image/whalenurse-image.tar.gz"
      - name: Run the demo
        run: test/demo/run.sh whalenurse-test/whalenurse:ci

  integration-shard:
    # The six legs (2 image stores x 3 compose releases) each run the whole suite, split over three runners: the tests are
    # real ladders against a real daemon and run one after another, so one runner per leg took ~14 minutes. A runner has
    # one daemon, and a whalenurse watches every opted-in container on its daemon, so the split is across runners, never
    # t.Parallel. scripts/ci/shard-integration.sh packs the tests (from `go test -list`, so none is forgotten) by their
    # recorded durations; the go job checks that this matrix is 0/n .. n-1/n of one n and covers every test once.
    # No `needs: [go]`: the unit tests and these shards start together (a red unit test cancels nothing, but costs only
    # runner minutes, and the wall clock is not 90 s longer for it). They wait for the image job, which builds the image
    # they test about as fast as each of them built it before. A "compose latest" shard does nothing (SKIP) while the
    # latest release is one the matrix pins: it would repeat that leg; the scope job decides.
    name: integration shard ${{ matrix.shard }} (${{ matrix.store }} store, compose ${{ matrix.compose }})
    runs-on: ubuntu-latest
    needs: [scope, image]
    if: needs.scope.outputs.code == 'true'
    timeout-minutes: 60
    env:
      SKIP: ${{ matrix.compose == 'latest' && needs.scope.outputs.latest_pinned == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        store: [classic, containerd]
        # v5.2.0 is the only release with compose bug #13878, v5.6.0 is the version M0 ran on, and "latest" floats (it is
        # v5.6.0 today, so those two legs coincide until a newer release). Plan section 6.
        compose: ["5.2.0", "5.6.0", latest]
        shard: ["0/3", "1/3", "2/3"]
    steps:
      - name: Compose latest is a release the matrix pins, so this shard would repeat that leg
        if: env.SKIP == 'true'
        env:
          LATEST: ${{ needs.scope.outputs.compose_latest }}
        run: echo "::notice::compose latest is v$LATEST, which the v$LATEST legs test; this shard does not run."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SKIP != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.SKIP != 'true'
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SKIP != 'true'
        with:
          name: whalenurse-image
          path: ${{ runner.temp }}/image
      # Engine 29.x and the compose release of the matrix. whalenurse runs this compose itself (rung 2, the dry-run oracle,
      # config --hash), so the oracle's output and the hash are what the matrix pins. A latest leg installs the release the
      # scope job resolved (setup-docker.sh resolves "latest" itself if the scope job could not).
      - name: Install the latest Docker Engine 29.x and Compose ${{ matrix.compose }}, select the image store
        if: env.SKIP != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPOSE: ${{ matrix.compose == 'latest' && needs.scope.outputs.compose_latest || matrix.compose }}
        run: scripts/ci/setup-docker.sh "${{ matrix.store }}" "$COMPOSE"
      # After setup-docker.sh: it restarts the daemon on the image store of the leg, and an image loaded before would be in
      # the other store.
      - name: Load the image (built by the image job)
        if: env.SKIP != 'true'
        run: docker load -i "$RUNNER_TEMP/image/whalenurse-image.tar.gz"
      - name: Docker environment
        if: env.SKIP != 'true'
        run: |
          docker version
          docker compose version
          echo "WHALENURSE_COMPOSE_BIN=$WHALENURSE_COMPOSE_BIN ($WHALENURSE_COMPOSE_VERSION)"
          docker info --format 'storage driver: {{.Driver}} / {{json .DriverStatus}}'
      - name: Run shard ${{ matrix.shard }} of the integration tests
        if: env.SKIP != 'true'
        env:
          WHALENURSE_INTEGRATION: "1"
          WHALENURSE_TEST_IMAGE: whalenurse-test/whalenurse:ci
          SHARD: ${{ matrix.shard }}
        run: |
          run=$(scripts/ci/shard-integration.sh "$SHARD")
          echo "-run '$run'"
          go test -tags integration -count=1 -v -timeout 50m -run "$run" ./test/integration/
      - name: Leftover test projects (should be empty)
        if: always() && env.SKIP != 'true'
        run: docker ps -a --filter label=com.docker.compose.project --format '{{.Names}} {{.Label "com.docker.compose.project"}}' | grep whalenurse-test- || true

  integration:
    # The six checks the repository ruleset requires, under their old names: each is green when every shard is. (A needs
    # on a matrix is all of its jobs, so one red shard turns all six red; the red shard's own name says which leg.) On a
    # documentation-only pull request the shards are skipped, and that is green only if the scope job succeeded and said
    # so: a failed scope job skips everything, and turns these six red.
    name: integration (${{ matrix.store }} store, compose ${{ matrix.compose }}; real Docker, whalenurse-test-* projects only)
    runs-on: ubuntu-latest
    needs: [scope, integration-shard]
    if: ${{ always() }}
    strategy:
      matrix:
        store: [classic, containerd]
        compose: ["5.2.0", "5.6.0", latest]
    steps:
      - name: Every shard passed (or the pull request changes only documentation)
        env:
          SCOPE: ${{ needs.scope.result }}
          CODE: ${{ needs.scope.outputs.code }}
          RESULT: ${{ needs.integration-shard.result }}
        run: |
          echo "scope: $SCOPE (code: $CODE), shards: $RESULT"
          if [ "$SCOPE" != success ]; then echo "::error::the scope job did not succeed, so nothing may be skipped"; exit 1; fi
          if [ "$CODE" = false ] && [ "$RESULT" = skipped ]; then echo "documentation only: no integration test needed"; exit 0; fi
          [ "$RESULT" = success ]

  image-drift:
    # Required checks of a matrix: on a documentation-only pull request the job runs and skips its steps, because a job
    # skipped as a whole does not report the matrix's names.
    name: image-drift check (${{ matrix.store }} store)
    runs-on: ubuntu-latest
    needs: [scope]
    timeout-minutes: 15
    env:
      RUN: ${{ needs.scope.outputs.code }}
    strategy:
      fail-fast: false
      matrix:
        store: [classic, containerd]
    steps:
      - name: Documentation only, nothing to check
        if: env.RUN != 'true'
        run: echo "Documentation only, no image-drift check needed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
        with:
          persist-credentials: false
      - name: Install the latest Docker Engine 29.x and Compose 5.6.0, select the image store
        if: env.RUN == 'true'
        run: scripts/ci/setup-docker.sh "${{ matrix.store }}"
      - name: Image drift (M0b scenario 5; whalenurse-m0-b-imgdrift project only)
        if: env.RUN == 'true'
        run: test/m0/m0b/image-drift.sh --out "$RUNNER_TEMP/imgdrift-${{ matrix.store }}"
      - name: Summary
        if: always() && env.RUN == 'true'
        run: cat "$RUNNER_TEMP/imgdrift-${{ matrix.store }}/summary.txt" || true
