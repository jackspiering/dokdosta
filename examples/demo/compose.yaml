# The two-minute demo (README.md, "Try it in 2 minutes"): whalenurse, a container that breaks on demand (bop, from
# github.com/jackspiering/bop) and a sidecar that shares its network. Everything is in this one project, and the timings are
# short so you can watch the whole ladder.
#
#   cd examples/demo
#   printf 'DOCKER_GID=%s\nDEMO_DIR=%s\n' "$(stat -c %g /var/run/docker.sock)" "$PWD" > .env
#   docker compose up -d
#   open http://localhost:8484                                  # the dashboard, loopback only
#   docker compose exec bop bop unhealthy sticky=true           # break it: unhealthy, and a restart does not fix it
#   docker compose logs -f whalenurse                           # restart, then recreate, then healthy again
#   docker compose down -v                                      # clean up
#
# COMPOSE_PLUGIN in .env (optional) is the host's compose plugin; `docker info` shows the path. Docker Desktop has none at the
# default path: leave the mount out and whalenurse uses its bundled compose, which only recreates containers made by the same
# compose release (otherwise it says "can't verify drift").
name: whalenurse-demo

services:
  whalenurse:
    image: ${WHALENURSE_IMAGE:-ghcr.io/jackspiering/whalenurse:latest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    group_add: ["${DOCKER_GID:?run: printf 'DOCKER_GID=%s\\nDEMO_DIR=%s\\n' \"$(stat -c %g /var/run/docker.sock)\" \"$PWD\" > .env}"]
    ports: ["127.0.0.1:8484:8484"] # loopback only; the dashboard needs no token there
    tmpfs:
      - /run:uid=65532,gid=65532,mode=0700
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - whalenurse-data:/data
      - ${COMPOSE_PLUGIN:-/usr/libexec/docker/cli-plugins/docker-compose}:/host/docker-compose:ro
      - ${DEMO_DIR:?set DEMO_DIR in .env}:${DEMO_DIR}:ro # this directory, at its identical path, so whalenurse can recreate
    environment:
      WHALENURSE_HOST_ID: demo
      WHALENURSE_HTTP_ADDR: ":8484"
      # Short timings for the demo only; the defaults (30s grace, 30s cooldown, 60s poll, 2m settle) suit a real host.
      WHALENURSE_GRACE: 5s
      WHALENURSE_COOLDOWN: 10s
      WHALENURSE_POLL_INTERVAL: 15s
      WHALENURSE_STARTUP_SETTLE: 10s

  # bop: healthy until told otherwise. `bop unhealthy sticky=true` makes /healthz fail and survive a restart, so the restart
  # rung cannot fix it and the recreate rung has to.
  bop:
    image: ghcr.io/jackspiering/bop:0.2.0
    restart: unless-stopped
    labels:
      whalenurse.enable: "true"

  # A sidecar in bop's network namespace. When bop is recreated it loses that namespace; whalenurse recreates it too.
  bop-sidecar:
    image: ghcr.io/jackspiering/bop:0.2.0
    restart: unless-stopped
    network_mode: service:bop
    command: ["sidecar", "--target=http://127.0.0.1:8080"]
    healthcheck:
      test: ["CMD", "/bop", "healthcheck", "--url=http://127.0.0.1:8080/info"]
      interval: 5s
      timeout: 2s
      retries: 3
    depends_on: [bop]

volumes:
  whalenurse-data: {}
